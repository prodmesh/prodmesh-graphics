name: release

# Plain pushes never release. A tag does — and only if it matches the version in
# the source, so a tag can never ship something it does not name.
#
# The server and the node ship as a MATCHED PAIR: a version skew between them is
# a show-stopper, not a degradation (ADR 0004). Cargo.toml and package.json are
# both checked against the tag for that reason.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: tag matches the source version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compare tag against Cargo.toml and package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          npm_v=$(node -p "require('./package.json').version")
          echo "tag=$tag cargo=$cargo_v npm=$npm_v"
          [ "$tag" = "$cargo_v" ] || { echo "::error::tag $tag != Cargo.toml $cargo_v"; exit 1; }
          [ "$tag" = "$npm_v" ]   || { echo "::error::tag $tag != package.json $npm_v"; exit 1; }

  build:
    name: build and sign (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --workspace --release
      - run: npm ci && npm run build

      # The gate. A release that has not printed PASS does not ship.
      - name: selftest gates the release
        shell: bash
        run: |
          cargo run -q --release -p pmg-cli -- --selftest | tee /tmp/selftest.txt
          grep -qx PASS /tmp/selftest.txt

      # macOS artifacts are Developer ID signed and notarized, same ritual as
      # prodmesh-rta. Certificates live in ~/Code/SIGNING and reach CI as
      # secrets; a fork with no secrets falls back to ad-hoc signing.
      #
      # - name: sign and notarize
      #   if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
      #   env:
      #     MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      #     APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      #   run: ./scripts/sign-and-notarize.sh

      - name: package
        shell: bash
        run: |
          echo "Packaging lands with the first real release — see docs/ROADMAP.md M1."
