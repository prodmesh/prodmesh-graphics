name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job that ENFORCES the pure-set rule (ADR 0004).
  #
  # pmg-scene, pmg-layout, pmg-text, pmg-anim, pmg-render, and pmg-color may not
  # depend on tokio, the filesystem, or any vendor SDK — because pmg-render has
  # to compile to WASM unchanged for the Design canvas, which is the whole
  # premise of ADR 0001.
  #
  # This job IS the enforcement. A lint would drift; a build that fails cannot be
  # argued with. Do not make it non-blocking.
  pure-set-wasm:
    name: pure set builds for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --target wasm32-unknown-unknown \
            -p pmg-scene -p pmg-layout -p pmg-text \
            -p pmg-anim -p pmg-render -p pmg-color

  # Linux only, deliberately — the Actions economics, measured 2026-08-19:
  # macOS minutes bill at 10x and Windows at 2x, and one productive day of
  # three-OS pushes burned the org's entire 2 000-minute free month (334 Linux
  # + 175x2 Windows + 133x10 macOS = 2 014). Nearly everything a commit can
  # break is platform-independent and Linux catches it at 1x; macOS and
  # Windows still run the FULL suite — build, tests, selftest — on every tag
  # (release.yml), which is where a platform difference must be caught before
  # it ships. The parity workflow keeps its macOS runner: it exists to compare
  # GPU backends, which is the one thing Linux runners cannot do.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # ALSA headers: pmg-out-audio (ADR 0028) reaches the host sound device
      # through cpal, and without them alsa-sys's build script panics before
      # clippy sees a line of ours. DejaVu: the bold and oblique faces
      # pmg-text's matching tests choose between (-core has no oblique).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev fonts-dejavu-core fonts-dejavu-extra
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Builds without the DeckLink SDK present. That is a supported
      # configuration, not a degraded one — see sys/decklink-sys/build.rs.
      - run: cargo build --workspace
      - run: cargo test --workspace

      # The release gate, same as prodmesh-caption and prodmesh-rta. Must print
      # PASS; grepping for it means a silent early exit fails the job.
      - name: selftest
        shell: bash
        run: cargo run -q -p pmg-cli -- --selftest | tee /tmp/selftest.txt && grep -qx PASS /tmp/selftest.txt

  web:
    name: server + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The web bundle genuinely depends on the WASM artifact: Design imports
      # src/wasm/, which is generated rather than committed (a checked-in binary
      # drifts from the Rust it was built from). So the job that builds the app
      # has to build the wasm too — `npm run build` runs `npm run wasm` first.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The CLI version MUST match the RESOLVED wasm-bindgen crate version, or
      # the generated glue fails at load with a schema mismatch — measured the
      # hard way in this repo (a 0.2.104 CLI against a 0.2.127 crate).
      #
      # Read from Cargo.lock rather than pinned here, because the manifest says
      # "0.2.104" and caret-resolves to something newer: a hardcoded number
      # would be correct today and silently wrong after the next `cargo update`.
      - name: wasm-bindgen CLI, version taken from Cargo.lock
        run: |
          VER=$(awk '/^name = "wasm-bindgen"$/{f=1} f&&/^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          echo "wasm-bindgen resolves to $VER"
          cargo install --locked wasm-bindgen-cli@"$VER"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:server
      - run: npm run test:web

  docs:
    name: docs are internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every ADR carries a Seam section. "Deployable by somebody else" is only
      # real if it is a per-decision fact rather than an aspiration in VISION.md
      # (docs/VISION.md §Open, and ADR 0030).
      - name: every ADR has a Seam section
        run: |
          missing=0
          for f in docs/decisions/*.md; do
            grep -q '^## Seam' "$f" || { echo "::error file=$f::ADR has no '## Seam' section"; missing=1; }
          done
          exit $missing
      - name: internal doc links resolve
        run: |
          broken=0
          while IFS= read -r line; do
            src=${line%%:*}; target=${line#*:}
            resolved=$(cd "$(dirname "$src")" && realpath -m "${target%%#*}")
            [ -e "$resolved" ] || { echo "::error file=$src::broken link -> $target"; broken=1; }
          done < <(grep -rHoE '\]\(([A-Za-z0-9._/-]+\.md)' docs README.md AGENTS.md \
                     | sed -E 's/\]\(//' )
          exit $broken
