[package]
name = "pmg-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The golden-corpus bindings, for the parity harness only.
#
# OFF by default because they are the one thing here that is not part of the
# product: enabling them pulls ~90 constructed SceneDocs into the binary, which
# is 150 KB of the Design bundle a booth browser downloads to author graphics
# with. The corpus itself always builds and its tests always run — this gates
# only the wasm-bindgen exports, and without them dead-code elimination drops
# the documents from the app.
corpus = []

[dependencies]
pmg-render = { path = "../pmg-render" }
pmg-scene = { path = "../pmg-scene" }
pmg-layout = { path = "../pmg-layout" }
pmg-text = { path = "../pmg-text" }
pmg-anim = { path = "../pmg-anim" }
pmg-media = { path = "../pmg-media" }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
wgpu = { workspace = true, default-features = false, features = ["webgpu", "wgsl"] }

[dev-dependencies]
serde_json = { workspace = true }
