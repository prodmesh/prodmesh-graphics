[package]
name = "pmg-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
pmg-scene = { path = "../pmg-scene" }
pmg-layout = { path = "../pmg-layout" }
pmg-anim = { path = "../pmg-anim" }
pmg-text = { path = "../pmg-text" }
wgpu = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser backend. Native picks Metal/Vulkan/D3D12 from wgpu's defaults.
wgpu = { workspace = true, default-features = false, features = ["webgpu", "wgsl"] }

[dev-dependencies]
pmg-media = { path = "../pmg-media" }
png = { workspace = true }
pmg-layout = { path = "../pmg-layout" }
pollster = "0.4"
serde_json = { workspace = true }
