[workspace]
resolver = "2"
members = [
    "crates/pmg-scene",
    "crates/pmg-layout",
    "crates/pmg-text",
    "crates/pmg-anim",
    "crates/pmg-render",
    "crates/pmg-color",
    "crates/pmg-media",
    "crates/pmg-audio",
    "crates/pmg-cas",
    "crates/pmg-proto",
    "crates/pmg-node",
    "crates/pmg-out-ndi",
    "crates/pmg-out-decklink",
    "crates/pmg-out-window",
    "crates/pmg-preview",
    "crates/pmg-wasm",
    "crates/pmg-cli",
    "sys/decklink-sys",
    "sys/ndi-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "LicenseRef-Proprietary"
publish = false

# Keep this in lockstep with package.json — the server and the node ship as a
# matched pair, and a version skew between them is a show-stopper (ADR 0004).

[workspace.dependencies]
# --- The pure set may use only these. No tokio, no std::fs, no vendor SDKs.
#     Enforced by the required wasm32-unknown-unknown CI job (ADR 0004).
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Pinned deliberately and identically for both targets. A wgpu bump is a
# release-gated change requiring a full golden re-run (risk R11).
wgpu = "30"
# Pure-set safe: no_std-capable, no filesystem, builds for wasm32.
ciborium = "0.2"
blake3 = "1"
taffy = "0.13"
# Shaping AND rasterization, with explicit subpixel-offset control — which is
# the point (risk R3). CPU-only, so glyphs are identical native vs wasm.
swash = "0.2"
serde_json = "1"

# --- Everything else. Available to non-pure crates only.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking, deliberately. The node is thread-per-output-group by design
# (ADR 0011) because that is how the plant is wired, and dropping an async
# runtime next to a hard frame loop buys nothing while adding a scheduler
# between a cue and the graphic. No TLS: a closed booth network, no
# certificates to manage, and PMG Link is plain ws:// by the same reasoning
# that gives the control server no HTTPS.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["gzip"] }

[profile.release]
# A late frame is a visible glitch. Optimise for consistent frame time rather
# than for build speed or binary size.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"          # the node catches and reports rather than dying
debug = 1                 # keep symbols: a crash on a Sunday needs a backtrace
